[workspace]
name = "spp-pipeline"
version = "0.1.0"
authors = ["Alan <alanzenh@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.2"
python-calamine = ">=0.2"

[pypi-dependencies]
spp-pipeline = { path = ".", editable = true }

[feature.matlab.pypi-dependencies]
matlabengine = "==24.2.*"

[feature.dev.dependencies]
ruff = ">=0.9"
pytest = ">=8"
pytest-cov = ">=5"
openpyxl = ">=3.1"

[environments]
default = ["matlab", "dev"]
prod = ["matlab"]
ci = ["dev"]

[tasks]
spp = "spp-pipeline"
test = "pytest"
lint = "ruff check src tests"
fix = "ruff check --fix src tests"
format = "ruff format src tests"
check = { depends-on = ["lint", "test"] }
